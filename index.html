<!DOCTYPE html>
<html lang="pt-BR" data-quality="cinematic" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1215" />
    <meta name="description" content="Dinastia E: sua companhia, decisões e aventuras em Cosmum. Fichas, combate e Diário Vivo para uma mesa conectada." />
    <meta name="color-scheme" content="dark" />
    <script>
      // DINASTIA EARLY CLIENT COMPAT · revisado 2026-11-15
      // Aplica o modo seguro ANTES do bundle React/CSS montar, senão algumas
      // rotas ficam suscetíveis a tela preta no compositor do Opera GX.
      //
      // A versão anterior ligava o modo seguro para QUALQUER Opera (/Opera\//).
      // Isso rebaixava o Opera comum — que é Chromium igual ao Chrome e ao Edge
      // — a um visual sem desfoque e com o fundo cósmico parado, sem motivo. O
      // bug de compositor é do GX. Agora: só GX, só quem pedir ?safe, e só quem
      // já pediu antes (fica guardado, porque numa tela preta não se lê nada).
      (() => {
        try {
          const ua = navigator.userAgent || '';
          const query = new URLSearchParams(location.search);
          const asked = query.get('safe');
          const KEY = 'dinastia_safe_graphics_v1';
          if (asked === '0' || asked === 'off') { try { localStorage.removeItem(KEY); } catch (_) {} }
          else if (asked !== null) { try { localStorage.setItem(KEY, '1'); } catch (_) {} }
          let remembered = false;
          try { remembered = localStorage.getItem(KEY) === '1'; } catch (_) {}
          const isOperaGx = /OPRGX/i.test(ua) || /Opera ?GX/i.test(ua);
          if (isOperaGx || remembered || (asked !== null && asked !== '0' && asked !== 'off')) {
            document.documentElement.classList.add('opera-gx-safe');
            window.__DINASTIA_SAFE_GRAPHICS__ = true;
          }
        } catch (_) {}
      })();

      // MOVIMENTO · 2026-11-15
      // O <html> já nasce com data-motion="full", então a mesa se mexe antes
      // mesmo do React montar e nunca há um instante congelado na abertura.
      // Aqui só corrigimos isso para quem escolheu outra coisa. A regra viva
      // está em src/adventure/movimento.mjs; esta cópia existe porque o CSS
      // é aplicado antes de qualquer módulo carregar.
      (() => {
        try {
          const salvo = localStorage.getItem('dinastia_player_preferences_v1');
          const escolha = salvo ? JSON.parse(salvo).motion : 'full';
          if (escolha !== 'reduced' && escolha !== 'system') return;
          const sistemaPedeReduzir = Boolean(window.matchMedia
            && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          if (escolha === 'reduced' || sistemaPedeReduzir) {
            document.documentElement.setAttribute('data-motion', 'reduced');
          }
        } catch (_) {}
      })();
    </script>
    <!--
      AS FONTES

      Seis famílias viravam treze arquivos. O corte abaixo tira o que
      ninguém via: o peso 900 da Cinzel Decorative aparecia UMA vez, num
      selo de 11px — tamanho em que 700 e 900 são indistinguíveis —, e o
      itálico da Crimson Text nunca era pedido junto do peso 600.

      Uma família não está aqui de propósito: a IBM Plex Mono, usada em 58
      lugares. Todos caem em `ui-monospace`, que no celular e no desktop é
      a mono do próprio sistema — já instalada, zero byte, e melhor
      desenhada para número pequeno do que qualquer mono que se baixe.

      Estas fontes ainda vêm do Google. Hospedar no próprio domínio corta
      duas conexões (DNS + TLS para fonts.gstatic.com) antes do primeiro
      texto aparecer: `npm run fontes:local` faz isso e reescreve este
      bloco — precisa rodar numa máquina com saída para a internet.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&amp;family=Cinzel:wght@400;600;700&amp;family=Crimson+Text:ital,wght@0,400;0,600;1,400&amp;family=IM+Fell+English+SC&amp;family=IM+Fell+English:ital@0;1&amp;display=swap" />
    <title>Dinastia E — Livro do Mundo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
